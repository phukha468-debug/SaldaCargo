<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaldaCargo — 4 варианта панели управления</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- ── Верхняя панель управления просмотром ── -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-sky-500 flex items-center justify-center font-black text-white text-base shadow">S</div>
        <div>
          <h1 class="font-extrabold text-sm text-white leading-tight">SaldaCargo — Дизайн панели управления</h1>
          <p class="text-xs text-slate-400">Выберите вариант ниже для интерактивного тестирования</p>
        </div>
      </div>

      <!-- Кнопки переключения режимов -->
      <div class="flex items-center bg-slate-900/90 p-1 rounded-xl border border-slate-700 gap-1 text-xs">
        <button onclick="setVariant('v1')" id="btn-v1" class="tab-btn px-3 py-1.5 rounded-lg font-bold transition-all bg-sky-600 text-white shadow-xs">
          1. Светлый классический
        </button>
        <button onclick="setVariant('v2')" id="btn-v2" class="tab-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all">
          2. Органичный (карточки)
        </button>
        <button onclick="setVariant('v3')" id="btn-v3" class="tab-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all">
          3. Верхнее меню (без сайдбара)
        </button>
        <button onclick="setVariant('v4')" id="btn-v4" class="tab-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all">
          4. Компактный док
        </button>
        <div class="w-px h-5 bg-slate-700 mx-1"></div>
        <button onclick="setVariant('grid')" id="btn-grid" class="tab-btn px-3 py-1.5 rounded-lg font-medium text-amber-400 hover:text-amber-300 flex items-center gap-1">
          <span class="material-symbols-outlined text-[16px]">grid_view</span> Сравнить 4-в-1
        </button>
      </div>
    </div>
  </header>

  <!-- ── Информационный баннер текущего варианта ── -->
  <div id="variant-info" class="bg-sky-950/60 border-b border-sky-800/50 px-4 py-2 text-xs text-sky-200">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div id="info-text">
        <span class="font-bold text-white">Вариант 1 (Светлый классический):</span> Сайдбар в чистом белом цвете с мягкой подсветкой активного пункта. Идеальная гармония со светлым дашбордом.
      </div>
      <span class="bg-sky-500/20 text-sky-300 text-[11px] font-bold px-2 py-0.5 rounded border border-sky-400/30">Рекомендуемый</span>
    </div>
  </div>

  <!-- ── Контейнер интерактивного экрана ── -->
  <main class="flex-1 p-4 lg:p-6 flex flex-col justify-center items-center">
    <div class="w-full max-w-[1440px] bg-slate-100 rounded-2xl shadow-2xl border border-slate-300 overflow-hidden min-h-[720px] flex flex-col text-slate-800" id="preview-container">
      <!-- Динамический контент дашборда рендерится через JS -->
    </div>
  </main>

  <script>
    const navItems = [
      { href: '/', label: 'Главная', icon: 'dashboard', badge: 0 },
      { href: '/review', label: 'Ревью рейсов', icon: 'rate_review', badge: 3, critical: false },
      { href: '/finance', label: 'Финансы / P&L', icon: 'account_balance_wallet', badge: 2, critical: true },
      { href: '/fleet', label: 'Автопарк', icon: 'local_shipping', badge: 0 },
      { href: '/garage', label: 'Гараж / СТО', icon: 'build', badge: 1, critical: false },
      { href: '/counterparties', label: 'Контрагенты', icon: 'corporate_fare', badge: 0 },
      { href: '/staff', label: 'Персонал', icon: 'badge', badge: 0 },
      { href: '/retro', label: 'Ретро-ввод', icon: 'history', badge: 0 },
    ];

    let currentActive = 'Главная';
    let currentVariant = 'v1';

    function setActiveNav(label) {
      currentActive = label;
      render();
    }

    function setVariant(v) {
      currentVariant = v;
      // Update buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition-all';
      });
      const activeBtn = document.getElementById('btn-' + v);
      if (activeBtn) {
        activeBtn.className = 'tab-btn px-3 py-1.5 rounded-lg font-bold transition-all bg-sky-600 text-white shadow-xs';
      }

      // Update info banner
      const infoEl = document.getElementById('info-text');
      if (v === 'v1') {
        infoEl.innerHTML = '<span class="font-bold text-white">Вариант 1 (Светлый классический):</span> Чистый белый сайдбар (bg-white), деликатная голубая подсветка активного пункта, единый светлый стиль интерфейса.';
      } else if (v === 'v2') {
        infoEl.innerHTML = '<span class="font-bold text-white">Вариант 2 (Органичный / Карточки):</span> Сайдбар мягко сливается с фоном страницы, а активные пункты всплывают как рельефные белые карточки с тенью.';
      } else if (v === 'v3') {
        infoEl.innerHTML = '<span class="font-bold text-white">Вариант 3 (Верхнее меню):</span> Бокового бара нет вообще! Меню перенесено в верхнюю горизонтальную строку, освобождая 100% ширины под таблицы.';
      } else if (v === 'v4') {
        infoEl.innerHTML = '<span class="font-bold text-white">Вариант 4 (Компактный док):</span> Тонкая вертикальная полоса (80px) с аккуратными квадратными иконками и микро-подписями (стиль Linear / MacOS dock).';
      } else if (v === 'grid') {
        infoEl.innerHTML = '<span class="font-bold text-white">Сравнение 4-в-1:</span> Все 4 концепта бок о бок для наглядной оценки визуального баланса.';
      }

      render();
    }

    function getSampleContent() {
      return `
        <div class="space-y-6">
          <!-- Верхние карточки показателей -->
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
              <div class="flex items-center justify-between text-slate-500 text-xs font-semibold">
                <span>Выручка за сегодня</span>
                <span class="material-symbols-outlined text-sky-500 text-[20px]">trending_up</span>
              </div>
              <div class="text-2xl font-black text-slate-900 mt-2">142 500 ₽</div>
              <div class="text-xs text-emerald-600 font-bold mt-1 flex items-center gap-1">
                <span>+18.4%</span> <span class="text-slate-400 font-normal">к прошлой неделе</span>
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
              <div class="flex items-center justify-between text-slate-500 text-xs font-semibold">
                <span>Рейсов на линии</span>
                <span class="material-symbols-outlined text-amber-500 text-[20px]">local_shipping</span>
              </div>
              <div class="text-2xl font-black text-slate-900 mt-2">14 из 18</div>
              <div class="text-xs text-slate-500 font-medium mt-1">4 тягача на ТО в гараже</div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
              <div class="flex items-center justify-between text-slate-500 text-xs font-semibold">
                <span>Дебиторка (клиенты)</span>
                <span class="material-symbols-outlined text-rose-500 text-[20px]">pending_actions</span>
              </div>
              <div class="text-2xl font-black text-rose-600 mt-2">380 000 ₽</div>
              <div class="text-xs text-rose-500 font-bold mt-1">2 счета просрочены</div>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
              <div class="flex items-center justify-between text-slate-500 text-xs font-semibold">
                <span>Чистая прибыль (мес.)</span>
                <span class="material-symbols-outlined text-emerald-500 text-[20px]">payments</span>
              </div>
              <div class="text-2xl font-black text-slate-900 mt-2">892 400 ₽</div>
              <div class="text-xs text-emerald-600 font-bold mt-1">Рентабельность 24%</div>
            </div>
          </div>

          <!-- Таблица последних рейсов -->
          <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
              <div>
                <h3 class="font-extrabold text-slate-900 text-sm">Оперативный статус рейсов</h3>
                <p class="text-xs text-slate-400">Текущие рейсы SaldaCargo на линии</p>
              </div>
              <button class="px-3 py-1.5 bg-sky-50 text-sky-700 rounded-xl text-xs font-bold border border-sky-200 hover:bg-sky-100 transition-colors">
                + Добавить рейс
              </button>
            </div>
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 text-slate-500 border-b border-slate-200 font-bold uppercase tracking-wider text-[10px]">
                <tr>
                  <th class="p-3 pl-4">Машина</th>
                  <th class="p-3">Водитель</th>
                  <th class="p-3">Маршрут</th>
                  <th class="p-3">Груз / Клиент</th>
                  <th class="p-3">Ставка</th>
                  <th class="p-3 pr-4">Статус</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 font-medium text-slate-700">
                <tr class="hover:bg-slate-50/70 transition-colors">
                  <td class="p-3 pl-4 font-bold text-slate-900">Scania A 742 TC</td>
                  <td class="p-3">Алексей Смирнов</td>
                  <td class="p-3">Екатеринбург → Салда</td>
                  <td class="p-3">ТМК Металл</td>
                  <td class="p-3 font-bold text-slate-900">48 000 ₽</td>
                  <td class="p-3 pr-4"><span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold text-[10px]">В пути</span></td>
                </tr>
                <tr class="hover:bg-slate-50/70 transition-colors">
                  <td class="p-3 pl-4 font-bold text-slate-900">Volvo M 118 KP</td>
                  <td class="p-3">Иван Белов</td>
                  <td class="p-3">Тагил → Челябинск</td>
                  <td class="p-3">ВСМПО-Ависма</td>
                  <td class="p-3 font-bold text-slate-900">65 000 ₽</td>
                  <td class="p-3 pr-4"><span class="bg-sky-100 text-sky-800 px-2 py-0.5 rounded-full font-bold text-[10px]">Погрузка</span></td>
                </tr>
                <tr class="hover:bg-slate-50/70 transition-colors">
                  <td class="p-3 pl-4 font-bold text-slate-900">КамАЗ B 902 OP</td>
                  <td class="p-3">Сергей Кузнецов</td>
                  <td class="p-3">Салда → Тюмень</td>
                  <td class="p-3">СтройКомплект</td>
                  <td class="p-3 font-bold text-slate-900">54 000 ₽</td>
                  <td class="p-3 pr-4"><span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold text-[10px]">На проверке</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function getHeaderWidget() {
      return `
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-3 bg-slate-900 text-white px-4 py-2 rounded-2xl shadow-sm">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-emerald-400 text-[20px]">account_balance</span>
              <div>
                <div class="text-[9px] font-extrabold uppercase tracking-widest text-slate-400">Совокупный Баланс</div>
                <div class="text-sm font-black text-white leading-none mt-0.5">1 245 800 ₽</div>
              </div>
            </div>
            <div class="h-6 w-px bg-slate-700 mx-1 hidden sm:block"></div>
            <div class="text-xs text-slate-300 hidden sm:block">
              <span class="text-sky-400 font-bold">Банк:</span> 850 000 ₽ <br>
              <span class="text-emerald-400 font-bold">Касса:</span> 395 800 ₽
            </div>
          </div>
          <div class="hidden sm:flex items-center gap-1.5 bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs shadow-xs">
            <span class="font-black text-slate-800">20</span>
            <span class="font-semibold text-slate-700">авг</span>
            <span class="text-slate-400">(чт)</span>
          </div>
        </div>
      `;
    }

    function render() {
      const container = document.getElementById('preview-container');

      if (currentVariant === 'v1') {
        // ── VARIANT 1: Clean Light ──
        container.innerHTML = `
          <div class="flex-1 flex min-h-[700px]">
            <!-- Sidebar -->
            <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 shadow-xs">
              <div class="p-5 border-b border-slate-100 flex items-center gap-3">
                <div class="w-9 h-9 bg-sky-600 rounded-xl flex items-center justify-center font-black text-white text-lg shadow-sm shadow-sky-600/20">S</div>
                <div>
                  <div class="font-extrabold text-base tracking-tight text-slate-900 leading-snug">SaldaCargo</div>
                  <div class="text-[11px] text-slate-500 font-medium">Управление автопарком</div>
                </div>
              </div>

              <nav class="p-3 space-y-1 flex-1 overflow-y-auto custom-scroll">
                <div class="px-3 py-2 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Навигация</div>
                ${navItems.map(item => `
                  <button onclick="setActiveNav('${item.label}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold text-sm transition-all text-left ${
                    currentActive === item.label
                      ? 'bg-sky-50 text-sky-700 font-bold border border-sky-200/80 shadow-xs'
                      : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent'
                  }">
                    <span class="material-symbols-outlined text-[20px] ${currentActive === item.label ? 'text-sky-600' : 'text-slate-400'}">${item.icon}</span>
                    <span class="truncate">${item.label}</span>
                    ${item.badge > 0 ? `
                      <span class="ml-auto text-xs px-2 py-0.5 rounded-full font-bold border ${item.critical ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-amber-50 text-amber-700 border-amber-200'}">
                        ${item.badge}
                      </span>
                    ` : ''}
                  </button>
                `).join('')}
              </nav>

              <div class="p-3.5 border-t border-slate-100 bg-slate-50/50 text-[11px] text-slate-400 text-center font-medium">
                Версия 2.4 · SaldaCargo ERP
              </div>
            </aside>

            <!-- Main Area -->
            <div class="flex-1 flex flex-col min-w-0 bg-slate-100">
              <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between sticky top-0 z-20 shadow-xs">
                <div>
                  <div class="flex items-center gap-2">
                    <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">${currentActive}</h2>
                    <span class="bg-sky-50 text-sky-700 border border-sky-200/70 text-xs font-bold px-2.5 py-0.5 rounded-full">Вариант 1: Светлый</span>
                  </div>
                  <p class="text-xs text-slate-500 font-medium mt-0.5">Оперативная сводка финансовых потоков и статистики автопарка</p>
                </div>
                ${getHeaderWidget()}
              </header>
              <main class="flex-1 p-6 overflow-y-auto custom-scroll">${getSampleContent()}</main>
            </div>
          </div>
        `;
      } else if (currentVariant === 'v2') {
        // ── VARIANT 2: Seamless Floating Cards ──
        container.innerHTML = `
          <div class="flex-1 flex min-h-[700px]">
            <!-- Sidebar -->
            <aside class="w-64 bg-slate-100/90 border-r border-slate-200/70 flex flex-col shrink-0">
              <div class="p-5 border-b border-slate-200/60 flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center font-black text-white text-lg shadow-sm">S</div>
                <div>
                  <div class="font-extrabold text-base tracking-tight text-slate-900 leading-snug">SaldaCargo</div>
                  <div class="text-[11px] text-slate-500 font-medium">Управление автопарком</div>
                </div>
              </div>

              <nav class="p-3 space-y-1.5 flex-1 overflow-y-auto custom-scroll">
                <div class="px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Разделы</div>
                ${navItems.map(item => `
                  <button onclick="setActiveNav('${item.label}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-semibold text-sm transition-all text-left ${
                    currentActive === item.label
                      ? 'bg-white text-slate-900 font-bold border border-slate-200 shadow-sm translate-x-0.5'
                      : 'text-slate-600 hover:bg-slate-200/60 hover:text-slate-900 border border-transparent'
                  }">
                    <span class="material-symbols-outlined text-[20px] ${currentActive === item.label ? 'text-indigo-600' : 'text-slate-400'}">${item.icon}</span>
                    <span class="truncate">${item.label}</span>
                    ${item.badge > 0 ? `
                      <span class="ml-auto text-xs px-2 py-0.5 rounded-full font-bold border ${item.critical ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-amber-50 text-amber-700 border-amber-200'}">
                        ${item.badge}
                      </span>
                    ` : ''}
                  </button>
                `).join('')}
              </nav>

              <div class="p-3.5 border-t border-slate-200/60 text-[11px] text-slate-400 text-center font-medium">
                Версия 2.4 · SaldaCargo ERP
              </div>
            </aside>

            <!-- Main Area -->
            <div class="flex-1 flex flex-col min-w-0 bg-slate-100">
              <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between sticky top-0 z-20 shadow-xs">
                <div>
                  <div class="flex items-center gap-2">
                    <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">${currentActive}</h2>
                    <span class="bg-indigo-50 text-indigo-700 border border-indigo-200/70 text-xs font-bold px-2.5 py-0.5 rounded-full">Вариант 2: Карточки</span>
                  </div>
                  <p class="text-xs text-slate-500 font-medium mt-0.5">Единая фоновая интеграция с парящими пунктами меню</p>
                </div>
                ${getHeaderWidget()}
              </header>
              <main class="flex-1 p-6 overflow-y-auto custom-scroll">${getSampleContent()}</main>
            </div>
          </div>
        `;
      } else if (currentVariant === 'v3') {
        // ── VARIANT 3: Top Navigation Bar ──
        container.innerHTML = `
          <div class="flex-1 flex flex-col min-h-[700px] bg-slate-100">
            <!-- Top Header & Horizontal Tabs -->
            <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-xs">
              <div class="px-6 py-3.5 flex items-center justify-between">
                <div class="flex items-center gap-4">
                  <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 bg-sky-600 rounded-lg flex items-center justify-center font-black text-white shadow-sm">S</div>
                    <span class="font-extrabold text-slate-900 text-base tracking-tight">SaldaCargo</span>
                  </div>
                  <div class="h-6 w-px bg-slate-200"></div>
                  <div>
                    <h2 class="text-base font-extrabold text-slate-900">${currentActive}</h2>
                  </div>
                </div>
                ${getHeaderWidget()}
              </div>

              <!-- Horizontal Nav Tabs -->
              <div class="flex items-center gap-1.5 px-6 py-2 bg-slate-50 border-t border-slate-200 overflow-x-auto custom-scroll">
                ${navItems.map(item => `
                  <button onclick="setActiveNav('${item.label}')" class="flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all ${
                    currentActive === item.label
                      ? 'bg-white text-sky-700 font-bold border border-slate-200/80 shadow-xs'
                      : 'text-slate-600 hover:bg-slate-200/60 hover:text-slate-900 border border-transparent'
                  }">
                    <span class="material-symbols-outlined text-[17px] ${currentActive === item.label ? 'text-sky-600' : 'text-slate-400'}">${item.icon}</span>
                    <span>${item.label}</span>
                    ${item.badge > 0 ? `
                      <span class="text-[10px] px-1.5 py-0.2 rounded-full font-bold border ${item.critical ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-amber-50 text-amber-700 border-amber-200'}">
                        ${item.badge}
                      </span>
                    ` : ''}
                  </button>
                `).join('')}
              </div>
            </header>

            <main class="flex-1 p-6 overflow-y-auto custom-scroll">${getSampleContent()}</main>
          </div>

        container.innerHTML = `

              <nav class="flex-1 w-full px-2 space-y-2 overflow-y-auto custom-scroll flex flex-col items-center">

                  <button onclick="setActiveNav('${item.label}')" title="${item.label}" class="relative flex flex-col items-center justify-center w-14 h-13 rounded-xl transition-all group ${

                      ? 'bg-sky-50 text-sky-700 font-bold border border-sky-200/80 shadow-xs'

                    <span class="material-symbols-outlined text-[22px] ${currentActive === item.label ? 'text-sky-600' : 'text-slate-400 group-hover:text-slate-700'}">${item.icon}</span>
                    <span class="text-[9px] font-bold truncate max-w-[50px] leading-tight text-center mt-0.5">${item.label.split(' ')[0]}</span>
                    ${item.badge > 0 ? `
                      <span class="absolute -top-1 -right-1 w-4 h-4 text-[9px] flex items-center justify-center rounded-full font-extrabold text-white border-2 border-white ${item.critical ? 'bg-rose-500' : 'bg-amber-500'}">
                        ${item.badge}
                      </span>
                    ` : ''}
                  </button>
                `).join('')}
              </nav>

              <div class="text-[9px] text-slate-400 text-center font-bold">v2.4</div>

            <!-- Main Area -->
            <div class="flex-1 flex flex-col min-w-0 bg-slate-100">

                    <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">${currentActive}</h2>

                  <p class="text-xs text-slate-500 font-medium mt-0.5">Компактная ширина панели 80px — максимум пространства под таблицы</p>
                </div>
                ${getHeaderWidget()}
              </header>
              <main class="flex-1 p-6 overflow-y-auto custom-scroll">${getSampleContent()}</main>
            </div>
          </div>
        `;

                    <div class="grid grid-cols-2 gap-1"><div class="h-8 bg-white rounded border border-slate-200"></div><div class="h-8 bg-white rounded border border-slate-200"></div></div>

                </div>

              <!-- Card 2 -->
              <div onclick="setVariant('v2')" class="bg-white rounded-2xl border-2 border-slate-200 hover:border-indigo-500 p-4 cursor-pointer transition-all shadow-sm hover:shadow-md group">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                  <div>
                    <h3 class="font-extrabold text-sm text-slate-900 group-hover:text-indigo-600 transition-colors">2. Органичный (карточки)</h3>
                    <p class="text-[11px] text-slate-400">Единый серый фон, белые плавающие кнопки</p>
                  </div>
                  <span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-2 py-1 rounded-lg">Выбрать</span>
                </div>
                <div class="h-44 bg-slate-100 rounded-xl border border-slate-200 flex overflow-hidden">
                  <div class="w-1/3 bg-slate-100 border-r border-slate-200 p-2 space-y-1">
                    <div class="h-4 bg-indigo-600 rounded w-16 mb-2"></div>
                    <div class="h-3 bg-white rounded w-full shadow-xs border border-slate-200"></div>
                    <div class="h-3 bg-slate-200/60 rounded w-full"></div>
                    <div class="h-3 bg-slate-200/60 rounded w-full"></div>
                  </div>
                  <div class="flex-1 p-2 space-y-2">
                    <div class="h-4 bg-white rounded border border-slate-200 w-full"></div>
                    <div class="grid grid-cols-2 gap-1"><div class="h-8 bg-white rounded border border-slate-200"></div><div class="h-8 bg-white rounded border border-slate-200"></div></div>
                  </div>

              </div>

              <!-- Card 3 -->
              <div onclick="setVariant('v3')" class="bg-white rounded-2xl border-2 border-slate-200 hover:border-sky-500 p-4 cursor-pointer transition-all shadow-sm hover:shadow-md group">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                  <div>
                    <h3 class="font-extrabold text-sm text-slate-900 group-hover:text-sky-600 transition-colors">3. Верхнее меню (без сайдбара)</h3>
                    <p class="text-[11px] text-slate-400">Горизонтальные вкладки, 100% полезной ширины</p>
                  </div>
                  <span class="text-xs font-bold bg-sky-50 text-sky-700 px-2 py-1 rounded-lg">Выбрать</span>
                </div>
                <div class="h-44 bg-slate-100 rounded-xl border border-slate-200 flex flex-col overflow-hidden">

                  <div class="flex-1 p-2 space-y-2"><div class="grid grid-cols-3 gap-1"><div class="h-8 bg-white rounded border border-slate-200"></div><div class="h-8 bg-white rounded border border-slate-200"></div><div class="h-8 bg-white rounded border border-slate-200"></div></div></div>
                </div>
              </div>

              <!-- Card 4 -->
              <div onclick="setVariant('v4')" class="bg-white rounded-2xl border-2 border-slate-200 hover:border-sky-500 p-4 cursor-pointer transition-all shadow-sm hover:shadow-md group">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                  <div>
                    <h3 class="font-extrabold text-sm text-slate-900 group-hover:text-sky-600 transition-colors">4. Компактный док</h3>
                    <p class="text-[11px] text-slate-400">Узкая колонка с иконками, стильный минимализм</p>
                  </div>
                  <span class="text-xs font-bold bg-sky-50 text-sky-700 px-2 py-1 rounded-lg">Выбрать</span>
                </div>
                <div class="h-44 bg-slate-100 rounded-xl border border-slate-200 flex overflow-hidden">
                  <div class="w-12 bg-white border-r border-slate-200 p-1.5 flex flex-col items-center space-y-1.5">
                    <div class="w-6 h-6 bg-sky-600 rounded"></div>
                    <div class="w-7 h-7 bg-sky-50 border border-sky-200 rounded-lg"></div>
                    <div class="w-7 h-7 bg-slate-100 rounded-lg"></div>

                  </div>
                  <div class="flex-1 p-2 space-y-2">
                    <div class="h-4 bg-white rounded border border-slate-200 w-full"></div>
                    <div class="grid grid-cols-2 gap-1"><div class="h-8 bg-white rounded border border-slate-200"></div><div class="h-8 bg-white rounded border border-slate-200"></div></div>
                  </div>

            </div>
          </div>
        `;

    // Первоначальный рендер
    render();
  </script>
